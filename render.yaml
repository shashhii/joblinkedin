# Render Blueprint — creates the free web service from this repo.
#
#   1. Push this repo to GitHub.
#   2. Render dashboard -> New -> Blueprint -> pick the repo.
#   3. Render reads this file and creates the service.
#
# The service uses the Docker runtime: Render builds the Dockerfile at the
# repo root. The image is based on the official Playwright image, which
# already contains Chromium + all system libraries, so the build is fast
# (no apt-get, no browser download).
#
# If you create the service manually instead, use:
#   Runtime:        Docker
#   (Render auto-detects the Dockerfile at the repo root)
#   Health Check:   /health
#
# Required environment variables (set in the service's Environment tab):
#   GEMINI_API_KEY        your Gemini key (AI question answering + monitor)
#   DAILY_CAP             applications per day (default 25)
#   MARATHON_TARGET       total applications (default 100)
#   R2_ACCOUNT_ID         Cloudflare account id
#   R2_ACCESS_KEY_ID      R2 API token access key id
#   R2_SECRET_ACCESS_KEY  R2 API token secret
#   R2_BUCKET             R2 bucket name

services:
  - type: web
    name: linkedin-marathon
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
